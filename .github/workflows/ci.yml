# Quality gates (TEST-001).
#
# Until this existed nothing ran any check but a person, so a broken test, a
# lint error or a failed build could merge unnoticed.
#
# Everything runs from farhat_football_app/ — it is the repository's only npm
# package and there is no manifest at the root (REPO-001).
name: CI

on:
  pull_request:
    branches: [zak-dev, staging, main]
  push:
    branches: [zak-dev, staging, main]

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: farhat_football_app

env:
  NODE_VERSION: "20.x"

jobs:
  quality:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: farhat_football_app/package-lock.json

      # ci, not install: fails on a lockfile that disagrees with package.json
      # rather than quietly resolving something new.
      - name: Clean install
        run: npm ci

      # Covers the backend too since QA-001 — 0 errors required, warnings
      # capped by --max-warnings in the lint script.
      - name: Lint
        run: npm run lint

      # Belt and braces alongside lint: a parse error in a .cjs file is worth
      # catching on its own terms, and this is the check the repo used before
      # ESLint reached the backend.
      - name: Backend syntax check
        run: |
          set -euo pipefail
          find . -name '*.cjs' -not -path './node_modules/*' -not -path './dist/*' -print0 \
            | xargs -0 -n1 node --check
          echo "All .cjs files parse."

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  integration:
    name: Integration tests and migration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: farhat_football_app/package-lock.json

      - name: Clean install
        run: npm ci

      # This provisions a throwaway postgres:16 through scripts/migrate.cjs
      # (DB-001), so it validates the migration path as well as the queries:
      # a baseline or migration that fails to apply fails the job here rather
      # than in production. Docker is preinstalled on ubuntu runners.
      - name: Integration tests
        run: npm run test:integration

  fresh-clone:
    name: Fresh clone smoke check
    runs-on: ubuntu-latest
    # DX-001. Proves a brand-new clone gets to a running server using only
    # tracked files and placeholder configuration — no production credential,
    # no hand-applied SQL, no undocumented step. If SETUP.md drifts from what
    # the repository can actually do, this is what notices.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farhat_football_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/farhat_football_dev
      # Placeholders, deliberately. The point is that none of these are real.
      AUTH0_DOMAIN: example.auth0.com
      VITE_AUTH0_AUDIENCE: https://api.example.test
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3000
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4

      # Reads .nvmrc rather than repeating the version, so the pin has one home.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: farhat_football_app/package-lock.json

      - name: Install exactly the lockfile
        run: npm ci

      - name: Provision the database from tracked files
        run: npm run migrate:provision

      - name: Applied versions are queryable
        run: npm run migrate:status

      - name: Build
        run: npm run build

      - name: Server starts and serves a public endpoint
        run: |
          npm start &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3000/api/v1/players > /dev/null; then
              echo "Server answered /api/v1/players on attempt $attempt."
              exit 0
            fi
            sleep 1
          done
          echo "Server did not serve a public endpoint within 20s."
          exit 1

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    # Scans the repository, not the npm package, so it opts out of the
    # workflow-level working-directory.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks git mode walks commits; the default shallow clone would
          # scan almost nothing and pass for the wrong reason.
          fetch-depth: 0

      # SEC-015. .env holds real production credentials and is protected by
      # .gitignore alone, in a public repository — one `git add -f` or a rename
      # that escapes the ignore rule is all it would take.
      #
      # Pinned by version, not :latest, so the gate cannot change under us.
      # Exits 1 when it finds anything, which fails the job.
      #
      # git mode (committed history) rather than dir mode on purpose: dir mode
      # also reads gitignored files, so locally it reports the real .env every
      # time and would train everyone to ignore it.
      - name: Scan committed history for secrets
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: farhat_football_app/package-lock.json

      - name: Clean install
        run: npm ci

      # THRESHOLD: high. Anything high or critical fails the build.
      #
      # Enforced since DEP-001 cleared the tree to zero advisories. It was
      # introduced non-blocking only because 1 critical and 5 high advisories
      # existed at the time. Do not reintroduce continue-on-error here — use a
      # documented `npm audit --audit-level` change if the threshold itself
      # needs to move, so the decision is visible.
      - name: "npm audit (threshold: high)"
        run: npm audit --audit-level=high
